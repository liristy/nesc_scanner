name: 核查规则与云端工作流验收
on:
  push:
    paths: ['src/**', 'scripts/**', 'test/**', 'deploy/server-trigger/**', '.github/workflows/**', 'package*.json', 'github-config.json']
  pull_request:
    paths: ['src/**', 'scripts/**', 'test/**', 'deploy/server-trigger/**', '.github/workflows/**', 'package*.json', 'github-config.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      JY_ALARM_CONFIG: github-config.json
      JY_ALARM_RUNTIME: github
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s deploy/server-trigger -p 'test_*.py'
      - run: systemd-analyze verify --man=no deploy/server-trigger/nesc-report-trigger.service deploy/server-trigger/nesc-report-trigger.timer
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:table
      - run: bash -n scripts/run-scheduled-report.sh scripts/publish-reports.sh
