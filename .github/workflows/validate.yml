name: 私有采集耗时诊断
on:
  push:
    branches: ['codex/diagnose-runtime-20261023']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - name: 读取两轮私有日志并输出匿名耗时统计
        env:
          REPORT_REPOSITORY: liristy/nesc_report
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node scripts/diagnose-runtime.mjs
