name: 心跳采集小批次验收
on:
  workflow_dispatch:
    inputs:
      date:
        description: '只读对照日期 YYYY-MM-DD；留空使用昨天'
        required: false
        type: string
      full_history:
        description: '额外验证完整历史心跳采集'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  checks: write
concurrency:
  group: jy-daily-report-${{ github.ref_name }}
  cancel-in-progress: false
env:
  REPORT_REPOSITORY: liristy/nesc_report
  JY_PUBLIC_RUN: 'true'
jobs:
  check:
    if: github.repository == 'liristy/nesc_scanner' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: private-reports
        shell: bash
    env:
      TZ: Asia/Shanghai
      JY_ALARM_CONFIG: ../github-config.json
      JY_ALARM_DATA_DIR: ${{ github.workspace }}/private-reports
      JY_ALARM_RUNTIME: github
      REPORT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: liristy/nesc_report
          ref: ${{ github.ref_name }}
          token: ${{ secrets.REPORT_REPO_TOKEN }}
          path: private-reports
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        working-directory: .
        run: |
          npm ci --omit=dev
          npx --no-install playwright install --with-deps chromium
      - name: 核验私有报告仓库
        env:
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node ../scripts/private-evidence.mjs verify
      - name: 创建实时进度入口
        id: init
        env:
          JY_PROGRESS_TOKEN: ${{ github.token }}
        run: node ../scripts/github-progress.mjs init
      - name: 只读小批次采集（不推进截止）
        id: monitor
        continue-on-error: true
        env:
          JY_ALARM_USERNAME: ${{ secrets.JY_ALARM_USERNAME }}
          JY_ALARM_PASSWORD: ${{ secrets.JY_ALARM_PASSWORD }}
          JY_CHECK_SNS: ${{ secrets.JY_CHECK_SNS }}
          JY_CHECK_DATE: ${{ inputs.date }}
          JY_CHECK_HISTORY: ${{ inputs.full_history }}
          JY_CHECK_SOURCE_ONLY: 'true'
          JY_DIAGNOSTIC: '1'
          JY_PROGRESS_TOKEN: ${{ github.token }}
          JY_PROGRESS_CHECK_ID: ${{ steps.init.outputs.check_id }}
        run: |
          mkdir -p run/private-logs
          node ../scripts/verify-collector-speed.mjs > run/private-logs/check.log 2>&1
      - name: 保存验收证据到私有仓库
        if: ${{ !cancelled() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        env:
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node ../scripts/private-evidence.mjs smoke
      - name: 检查验收结果
        if: steps.monitor.outcome == 'failure'
        run: |
          echo '只读验收未通过，详情见私有仓库草稿Release。'
          exit 1
      - name: 更新最终进度状态
        if: ${{ always() }}
        env:
          JY_PROGRESS_TOKEN: ${{ github.token }}
          JY_PROGRESS_CHECK_ID: ${{ steps.init.outputs.check_id }}
          PROGRESS_OUTCOME: ${{ job.status }}
        run: node ../scripts/github-progress.mjs finish
