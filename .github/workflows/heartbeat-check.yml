name: 心跳采集小批次验收
on:
  workflow_dispatch:
    inputs:
      date:
        description: '只读对照日期 YYYY-MM-DD；留空使用昨天'
        required: false
        type: string
      full_history:
        description: '额外验证完整历史心跳采集'
        required: false
        default: false
        type: boolean
      alarm_window:
        description: 'dev 只读验收指定日的完整报警窗口，不生成日报'
        required: false
        default: false
        type: boolean
      alarm_end_at:
        description: 'dev 报警验收的北京时间截止 YYYY-MM-DD HH:mm:ss（留空为 16:00）'
        required: false
        type: string
      online_cells:
        description: '从私有跟踪名单选择在线设备，并要求完整读取实时电芯'
        required: false
        default: false
        type: boolean
      private_query_id:
        description: 'dev 专项只读核查使用的私有草稿 Release 编号'
        required: false
        type: string
permissions:
  contents: read
  checks: write
concurrency:
  group: jy-daily-report-${{ github.ref_name }}
  cancel-in-progress: false
env:
  REPORT_REPOSITORY: liristy/nesc_report
  JY_PUBLIC_RUN: 'true'
jobs:
  check:
    if: >-
      github.repository == 'liristy/nesc_scanner' &&
      github.ref_type == 'branch' &&
      (github.ref_name == github.event.repository.default_branch || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: private-reports
        shell: bash
    env:
      TZ: Asia/Shanghai
      JY_ALARM_CONFIG: ../github-config.json
      JY_ALARM_DATA_DIR: ${{ github.workspace }}/private-reports
      JY_ALARM_RUNTIME: github
      REPORT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: liristy/nesc_report
          ref: ${{ github.ref_name }}
          token: ${{ secrets.REPORT_REPO_TOKEN }}
          path: private-reports
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        working-directory: .
        run: |
          npm ci --omit=dev
      - name: 核验私有报告仓库
        env:
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node ../scripts/private-evidence.mjs verify
      - name: 创建实时进度入口
        id: init
        env:
          JY_PROGRESS_TOKEN: ${{ github.token }}
        run: node ../scripts/github-progress.mjs init
      - name: 只读小批次采集（不推进截止）
        id: monitor
        continue-on-error: true
        env:
          JY_ALARM_USERNAME: ${{ secrets.JY_ALARM_USERNAME }}
          JY_ALARM_PASSWORD: ${{ secrets.JY_ALARM_PASSWORD }}
          JY_CHECK_DATE: ${{ inputs.date }}
          JY_CHECK_HISTORY: ${{ inputs.full_history }}
          JY_CHECK_ONLINE_CELLS: ${{ inputs.online_cells }}
          JY_PROGRESS_TOKEN: ${{ github.token }}
          JY_PROGRESS_CHECK_ID: ${{ steps.init.outputs.check_id }}
          JY_PRIVATE_QUERY_ID: ${{ inputs.private_query_id }}
          JY_CHECK_ALARM_WINDOW: ${{ inputs.alarm_window }}
          JY_CHECK_ALARM_END_AT: ${{ inputs.alarm_end_at }}
        run: |
          mkdir -p run/private-logs
          if [[ "$JY_CHECK_ALARM_WINDOW" == "true" ]]; then
            node ../scripts/verify-alarm-window.mjs > run/private-logs/check.log 2>&1
          elif [[ -z "$JY_PRIVATE_QUERY_ID" ]]; then
            node ../scripts/verify-collector-speed.mjs > run/private-logs/check.log 2>&1
          fi
      - name: 专项只读核查
        id: investigation
        if: github.ref_name == 'dev' && inputs.private_query_id != '' && !inputs.alarm_window
        continue-on-error: true
        env:
          JY_ALARM_USERNAME: ${{ secrets.JY_ALARM_USERNAME }}
          JY_ALARM_PASSWORD: ${{ secrets.JY_ALARM_PASSWORD }}
          JY_PRIVATE_QUERY_ID: ${{ inputs.private_query_id }}
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node ../scripts/inspect-batch.mjs > run/private-logs/check.log 2>&1
      - name: 保存验收证据到私有仓库
        if: ${{ !cancelled() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        env:
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node ../scripts/private-evidence.mjs smoke
      - name: 检查验收结果
        if: steps.monitor.outcome == 'failure' || steps.investigation.outcome == 'failure' || (inputs.private_query_id != '' && github.ref_name != 'dev')
        run: |
          echo '只读验收未通过，详情见私有仓库草稿Release。'
          exit 1
      - name: 更新最终进度状态
        if: ${{ always() }}
        working-directory: .
        env:
          JY_PROGRESS_TOKEN: ${{ github.token }}
          JY_PROGRESS_CHECK_ID: ${{ steps.init.outputs.check_id }}
          PROGRESS_OUTCOME: ${{ job.status }}
        run: node scripts/github-progress.mjs finish
