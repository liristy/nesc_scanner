name: 完整区间只读测试
run-name: 完整只读测试（不写报告）
on:
  workflow_dispatch:
    inputs:
      start:
        description: '北京时间起点 YYYY-MM-DD HH:mm:ss（不含）'
        required: true
        type: string
      end:
        description: '北京时间截止 YYYY-MM-DD HH:mm:ss（含）'
        required: true
        type: string
permissions:
  contents: read
  checks: write
concurrency:
  group: jy-daily-report-main
  cancel-in-progress: false
env:
  REPORT_REPOSITORY: liristy/nesc_report
  JY_PUBLIC_RUN: 'true'
jobs:
  check:
    if: github.repository == 'liristy/nesc_scanner' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: private-reports
        shell: bash
    env:
      TZ: Asia/Shanghai
      JY_ALARM_CONFIG: ../github-config.json
      JY_ALARM_DATA_DIR: ${{ github.workspace }}/private-reports
      JY_ALARM_RUNTIME: github
      REPORT_BRANCH: main
      JY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      JY_READONLY_FULL: 'true'
      JY_PROGRESS_LABEL: 完整只读测试进度（不写报告）
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: liristy/nesc_report
          ref: main
          token: ${{ secrets.REPORT_REPO_TOKEN }}
          path: private-reports
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 安装测试依赖
        working-directory: .
        run: |
          npm ci --omit=dev
          npx --no-install playwright install --with-deps chromium
      - name: 核验私有仓库并恢复历史只读证据
        env:
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: |
          node ../scripts/private-evidence.mjs restore
          node ../scripts/cloud-runtime.mjs import
      - name: 创建实时进度入口
        id: init
        env:
          JY_PROGRESS_TOKEN: ${{ github.token }}
        run: node ../scripts/github-progress.mjs init
      - name: 完整区间只读核查与计时（不写报告、不推进截止）
        id: monitor
        continue-on-error: true
        env:
          JY_ALARM_USERNAME: ${{ secrets.JY_ALARM_USERNAME }}
          JY_ALARM_PASSWORD: ${{ secrets.JY_ALARM_PASSWORD }}
          JY_WINDOW_START: ${{ inputs.start }}
          JY_WINDOW_END: ${{ inputs.end }}
          JY_DIAGNOSTIC: '1'
          JY_PROGRESS_TOKEN: ${{ github.token }}
          JY_PROGRESS_CHECK_ID: ${{ steps.init.outputs.check_id }}
        run: |
          mkdir -p run/private-logs
          node ../scripts/readonly-window.mjs > run/private-logs/full-window.log 2>&1
      - name: 保存测试证据到私有草稿Release
        if: ${{ !cancelled() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        env:
          REPORT_REPO_TOKEN: ${{ secrets.REPORT_REPO_TOKEN }}
        run: node ../scripts/private-evidence.mjs smoke
      - name: 公开汇总计时
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const t=JSON.parse(fs.readFileSync('run/read-only-window/timing.json')); const r=fs.existsSync('run/read-only-window/result.json')?JSON.parse(fs.readFileSync('run/read-only-window/result.json')):{}; const out={status:t.status,collector_seconds:t.collector_seconds,protected_reports_state_unchanged:t.protected_reports_state_unchanged,alarm_rows:r.alarm_rows,device_attempts:r.device_attempts,heartbeat_complete:r.heartbeat_complete,heartbeat_incomplete:r.heartbeat_incomplete,pending_devices:r.pending_devices}; console.log(JSON.stringify(out)); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'完整只读区间测试（未写报告）\\n\\n'+JSON.stringify(out,null,2));"
      - name: 检查测试结果
        if: steps.monitor.outcome == 'failure'
        run: |
          echo '完整只读测试未通过；详细原因与原始证据仅在私有草稿Release。'
          exit 1
      - name: 更新最终进度
        if: ${{ always() && steps.init.outputs.check_id != '' }}
        working-directory: .
        env:
          JY_PROGRESS_TOKEN: ${{ github.token }}
          JY_PROGRESS_CHECK_ID: ${{ steps.init.outputs.check_id }}
          PROGRESS_OUTCOME: ${{ job.status }}
        run: node scripts/github-progress.mjs finish
